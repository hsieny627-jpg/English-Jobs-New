:root{--bg:#FFF7E8;--card:#fff;--ink:#23201C;--soft:#7A7166;--line:#F0E2C8;--hl:#FF7A45;--ok:#2FA35A;--no:#E0483E;--blue:#2F6FDE;
--oBg:#FFE3D6;--oIn:#B03A10;--gBg:#DCF0C8;--gIn:#2C6010;--bBg:#DCE8FB;--bIn:#1B4A9E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'AndikaEmbed',"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
.app{max-width:680px;margin:0 auto;padding:14px}
.card{background:var(--card);border:3px solid var(--line);border-radius:26px;padding:16px 12px 20px;text-align:center}
h1{font-size:30px;margin:4px 0 2px}
.sub{font-size:17px;color:var(--soft);margin-bottom:14px;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gi{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px;border-radius:18px;border:3px solid var(--line);background:#fff;cursor:pointer;font-family:inherit;min-height:112px;position:relative}
.gi .ge{font-size:38px;line-height:1.1}
.gi .gt{font-size:20px;font-weight:700}
.gi .gd{font-size:14px;color:var(--soft);line-height:1.4}
.gi .gn{position:absolute;top:6px;left:9px;font-size:15px;font-weight:700;color:var(--hl)}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:19px;color:var(--soft);margin-bottom:8px}
.bar b{color:var(--ok);font-size:23px}
.q{font-size:26px;font-weight:700;line-height:1.5;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.big{font-size:clamp(62px,17vw,104px);line-height:1.15}
.en{font-family:'AndikaEmbed',sans-serif;font-size:clamp(30px,8vw,50px);line-height:1.3;word-break:break-word}
.ch{display:block;width:100%;font-family:'AndikaEmbed',sans-serif;font-size:30px;min-height:74px;border-radius:18px;border:3px solid var(--line);background:#fff;cursor:pointer;color:var(--ink);margin-top:10px;padding:8px}
.ch.ok{background:#DFF5E6;border-color:var(--ok);color:var(--ok)}
.ch.no{background:#FDE3E1;border-color:var(--no);animation:sh .4s}
@keyframes sh{25%{transform:translateX(-9px)}50%{transform:translateX(9px)}75%{transform:translateX(-5px)}}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
.t{font-family:'AndikaEmbed',sans-serif;font-size:30px;min-width:54px;min-height:62px;padding:4px 12px;border-radius:14px;border:3px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.t.used{opacity:.25}
.slot{min-height:70px;font-family:'AndikaEmbed',sans-serif;font-size:clamp(28px,7vw,44px);border-bottom:4px dashed var(--line);margin:6px 4px;padding:4px;word-break:break-word}
.b{font-size:22px;min-height:62px;padding:8px 20px;border-radius:16px;border:3px solid var(--line);background:#fff;cursor:pointer;font-family:inherit;margin:10px 5px 0}
.b.pri{background:var(--oBg);border-color:var(--hl);color:var(--oIn)}
.fx{position:fixed;top:-60px;font-size:38px;pointer-events:none;animation:fall 1.4s ease-in forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.tw{display:inline-block;width:1.05em;height:1.32em;vertical-align:-.3em;border-radius:4px;background:url("data:image/svg+xml;utf8,<svg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20300%20380'><rect%20x='0'%20y='0'%20width='300'%20height='380'%20rx='46'%20fill='%23BCE4F6'/><polygon%20points='197,30%20208,35%20216,46%20241,57%20232,64%20225,71%20224,85%20227,96%20217,122%20206,148%20198,176%20193,204%20186,223%20182,237%20171,254%20163,267%20150,289%20138,312%20134,331%20133,350%20126,350%20119,345%20118,334%20113,325%20103,314%2094,303%2086,292%2078,282%2068,263%2061,246%2059,226%2062,204%2065,182%2069,166%2081,150%2091,138%20103,124%20119,105%20132,86%20146,68%20159,56%20169,49%20185,41'%20fill='%232FA35A'%20stroke='%2314532D'%20stroke-width='10'%20stroke-linejoin='round'/></svg>") center/contain no-repeat;margin-right:4px}
.hide{display:none!important}
.msg{font-size:24px;font-weight:700;min-height:40px;margin-top:10px}
.msg.g{color:var(--ok)}.msg.r{color:var(--no)}
.float{position:relative;height:330px;overflow:hidden;border-radius:18px;background:var(--bg);margin-top:10px}
.fw{position:absolute;font-family:'AndikaEmbed',sans-serif;font-size:26px;padding:6px 12px;border-radius:12px;background:#fff;border:3px solid var(--line);cursor:pointer;white-space:nowrap}
.fw.hit{background:#DFF5E6;border-color:var(--ok)}
.fw.miss{background:#FDE3E1;border-color:var(--no)}
.ord{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.oc{font-size:22px;padding:12px;border-radius:16px;border:3px solid var(--line);background:#fff;cursor:pointer;text-align:left;font-family:inherit;display:flex;align-items:center;gap:10px}
.oc .n{font-size:20px;font-weight:700;color:var(--hl);min-width:28px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.mc{aspect-ratio:3/4;border-radius:14px;border:3px solid var(--line);background:var(--oBg);font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:'AndikaEmbed',sans-serif;padding:2px;word-break:break-word;line-height:1.1}
.mc.up{background:#fff}
.mc.done{background:#DFF5E6;border-color:var(--ok);opacity:.55}
input[type=text]{font-family:'AndikaEmbed',sans-serif;font-size:30px;padding:10px;width:100%;border-radius:14px;border:3px solid var(--line);text-align:center}
.speed{display:flex;align-items:center;gap:10px;margin:14px auto 0;max-width:340px;font-size:28px}
#rate{flex:1;height:44px;accent-color:var(--hl)}
.timer{height:14px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:8px}
.timer i{display:block;height:100%;background:var(--hl);width:100%}
button:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.fx{display:none}}
.homeln{display:inline-flex;align-items:center;min-height:48px;padding:0 16px;margin-bottom:10px;border-radius:14px;border:3px solid var(--line);background:#fff;color:var(--ink);font-size:20px;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main class="app">
<a class="homeln" href="index.html">🏠 首頁</a>
  <section class="card" id="home">
    <h1>職業單字 10 種遊戲</h1>
    <div class="sub"><i class="tw"></i> 台灣 ＋ 🌍 全球<br>最受歡迎職業 21 個單字</div>
    <div class="grid" id="menu"></div>
  </section>

  <section class="card hide" id="play">
    <div class="bar"><button class="b" id="home2" style="min-height:46px;padding:4px 14px;font-size:17px;margin:0">☰ 回選單</button><span id="prog">1 / 10</span><span>⭐ <b id="sc">0</b></span></div>
    <div id="stage"></div>
    <div class="msg" id="msg"></div>
    <div class="speed"><span aria-hidden="true">🐢</span><input type="range" id="rate" min="0.5" max="1" step="0.1" value="0.8" aria-label="語速"><span aria-hidden="true">🐇</span></div>
  </section>
<div style="text-align:center;margin:14px auto 0"><a href="story.html" style="font-size:20px;color:#2F6FDE">📖 回單字小故事</a>　<a href="index.html" style="font-size:20px;color:#2F6FDE">🏠 首頁</a></div>
</main>
<script>const DATA={"J": [{"e": "professional athlete", "z": "職業運動員", "ic": "🏃", "tw": 1, "g": 5, "p": [["professional", "職業的"], ["athlete", "比賽的人"]], "o": ["希臘文 athlon", "獎品"]}, {"e": "esports player", "z": "電競選手", "ic": "🎮", "tw": 2, "g": 0, "p": [["esports", "電子競技"], ["play", "玩"], ["er", "的人"]], "o": ["現代英語 e + sports", "電子 + 運動"]}, {"e": "streamer", "z": "直播主", "ic": "📹", "tw": 3, "g": 0, "p": [["stream", "一直流"], ["er", "的人"]], "o": ["古英語 stream", "流動的水"]}, {"e": "doctor", "z": "醫師", "ic": "🩺", "tw": 4, "g": 1, "p": [["doct", "教"], ["or", "的人"]], "o": ["拉丁文 docere", "教"]}, {"e": "baker", "z": "麵包糕點師", "ic": "🍞", "tw": 5, "g": 0, "p": [["bak", "烤"], ["er", "的人"]], "o": ["古英語 bæcere", "烤東西的人"]}, {"e": "programmer", "z": "程式設計師", "ic": "💻", "tw": 6, "g": 4, "p": [["programm", "寫程式"], ["er", "的人"]], "o": ["希臘文 pro + graphein", "向前 + 寫"]}, {"e": "painter", "z": "畫家", "ic": "🎨", "tw": 7, "g": 0, "p": [["paint", "畫"], ["er", "的人"]], "o": ["英語 paint", "畫"]}, {"e": "singer", "z": "歌手", "ic": "🎤", "tw": 8, "g": 0, "p": [["sing", "唱歌"], ["er", "的人"]], "o": ["英語 sing", "唱歌"]}, {"e": "computer engineer", "z": "電腦工程師", "ic": "🖥️", "tw": 9, "g": 0, "p": [["computer", "電腦"], ["engin", "機器"], ["eer", "的人"]], "o": ["英語 compute", "計算"]}, {"e": "hairstylist", "z": "髮型師", "ic": "✂️", "tw": 10, "g": 0, "p": [["hair", "頭髮"], ["styl", "造型"], ["ist", "的人"]], "o": ["英語 hair + style", "頭髮 + 造型"]}, {"e": "engineer", "z": "工程師", "ic": "👷", "tw": 0, "g": 1, "p": [["engin", "機器"], ["eer", "的人"]], "o": ["拉丁文 ingenium", "聰明的點子"]}, {"e": "business manager", "z": "企業經理", "ic": "💼", "tw": 0, "g": 2, "p": [["business", "生意"], ["manag", "管理"], ["er", "的人"]], "o": ["拉丁文 manus", "手"]}, {"e": "teacher", "z": "老師", "ic": "🧑‍🏫", "tw": 0, "g": 2, "p": [["teach", "教"], ["er", "的人"]], "o": ["古英語 tæcan", "指出、教"]}, {"e": "lawyer", "z": "律師", "ic": "⚖️", "tw": 0, "g": 4, "p": [["law", "法律"], ["yer", "的人"]], "o": ["中古英語 lawe", "法律"]}, {"e": "psychologist", "z": "心理師", "ic": "🧠", "tw": 0, "g": 6, "p": [["psycho", "心"], ["log", "學問"], ["ist", "的人"]], "o": ["希臘文 psykhe", "心、靈魂"]}, {"e": "nurse", "z": "護理師", "ic": "💉", "tw": 0, "g": 5, "p": [["nurse", "照顧的人"]], "o": ["拉丁文 nutrire", "餵奶、養育"]}, {"e": "designer", "z": "設計師", "ic": "🖌️", "tw": 0, "g": 7, "p": [["de", "出來"], ["sign", "記號"], ["er", "的人"]], "o": ["拉丁文 designare", "畫出記號"]}, {"e": "police officer", "z": "警察", "ic": "👮", "tw": 0, "g": 7, "p": [["police", "警察"], ["offic", "工作"], ["er", "的人"]], "o": ["希臘文 polis", "城市"]}, {"e": "veterinarian", "z": "獸醫", "ic": "🐶", "tw": 0, "g": 8, "p": [["veterinari", "拉車的牲口"], ["an", "的人"]], "o": ["拉丁文 veterinarius", "照顧拉車牲口的"]}, {"e": "mechanic", "z": "汽車技師", "ic": "🔧", "tw": 0, "g": 8, "p": [["mechan", "機器"], ["ic", "的人"]], "o": ["希臘文 mekhane", "機器"]}, {"e": "architect", "z": "建築師", "ic": "🏛️", "tw": 0, "g": 10, "p": [["archi", "老大"], ["tect", "蓋房子"]], "o": ["希臘文 arkhi + tekton", "老大 + 蓋房子"]}], "TF": [["doct 的意思是「教」", 1, "doctor 來自拉丁文 docere，意思就是「教」。", 0], ["doctor 以前是「老師」的意思", 1, "拉丁文 doctor 本來指老師，約 1400 年才慢慢變成醫生。", 0], ["athlete 可以拆成 ath + lete", 0, "athlete 拆不開，要整個字記；它來自希臘文 athlon（獎品）。", 1], ["希臘文 athlon 的意思是「獎品」", 1, "為了拿獎品比賽的人，就是 athlete。", 0], ["police 來自希臘文「城市」polis", 1, "polis 是城市 → 管城市的事 → 後來指警察。", 0], ["bake 加 er 要留著 e，寫成 bakeer", 0, "bake 的 e 要去掉，寫成 baker。", 0], ["stream 的意思是「水流」", 1, "影片像水一樣一直流出來，所以叫 streamer。", 0], ["engineer 是 engine 加 er", 0, "engine 去掉 e 再加 eer，寫成 engineer。", 1], ["programmer 中間的 m 要寫兩個", 1, "program + m + er = programmer。", 0], ["teach 的意思是「教」", 1, "teach 來自古英語 tæcan，意思是指出來、教。", 0], ["veterinarius 是拉丁文「照顧拉車牲口的」", 1, "拉丁文 veterinarius 也當「牛醫」用，後來變成 veterinarian（獸醫）。", 0], ["archi 的意思是「小弟」", 0, "archi 是「老大、首領」，architect 是蓋房子的老大。", 0], ["-er、-or、-ist 都表示「做這件事的人」", 1, "teacher、doctor、stylist 都是這樣來的。", 0], ["vet 是 veterinarian 的短說法", 1, "平常口語都說 vet。", 0], ["hairstylist 的 styl 來自 style", 1, "style 去掉 e，加上 ist。", 0], ["singer 是 sing 加 er", 1, "唱歌的人就是 singer。", 0], ["tect 的意思是「蓋房子」", 1, "來自希臘文 tekton，建造者、木匠。", 0], ["esports 的 e 代表「英語」", 0, "e 代表 electronic（電子的）。", 0], ["painter 是 paint 加 er", 1, "畫畫的人就是 painter。", 0], ["program 來自希臘文「公開寫出來」", 1, "pro（向前、公開）+ graphein（寫）。", 1], ["lawyer 是 law 加 yer", 1, "-yer 是 -ier 的另一種寫法，也表示「人」。", 1], ["psycho 的意思是「心」", 1, "希臘文 psykhē 是心、靈魂；古希臘人用蝴蝶代表它。", 0], ["nurse 可以拆成 nur + se", 0, "nurse 拆不開，要整個字記；它來自拉丁文 nutrire（餵奶、養育）。", 1], ["designer 的 sign 意思是「記號」", 1, "de（出來）+ sign（記號）= 畫出記號。", 1], ["manage 本來是「訓練、控制馬」", 1, "義大利文 maneggiare 是「控制馬」，來自拉丁文 manus（手）。", 1], ["mechan 來自希臘文「機器」", 1, "希臘文 mēkhanē 是機器、工具。", 0]]};</script>
<script>
const $=id=>document.getElementById(id);
const J=DATA.J, TF=DATA.TF;
const WITHP=J.filter(j=>j.p), WITHO=J.filter(j=>j.o), ONEW=J.filter(j=>j.e.indexOf(' ')<0);
let sc=0,qi=0,total=10,G=null,timer=null,adv=false,queue=[];
function rate(){return Math.round(parseFloat($('rate').value)*10)/10}
function speak(t,w){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate()*(w?.9:1);if(w){u.pitch=.82;u.volume=.8}speechSynthesis.speak(u)}catch(e){}}
function sh(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(a,n){return sh(a).slice(0,n)}
function conf(){const e=['⭐','🎉','✨','🌟'];for(let k=0;k<16;k++){const s=document.createElement('span');s.className='fx';s.textContent=e[k%4];s.style.left=Math.random()*100+'vw';s.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),1900)}}
function say(t,cls){$('msg').className='msg '+(cls||'');$('msg').innerHTML=t}
function why(t){$('msg').className='msg r';$('msg').innerHTML='<span style="font-size:20px;color:var(--ink);font-weight:400">💡 '+t+'</span>'}
function bump(){sc+=adv?3:1;$('sc').textContent=sc;conf()}
/* 答錯 → 幾題後再出現一次 */
function missed(key){if(queue.length<4&&!queue.some(q=>q.k===key)){queue.push({k:key,due:qi+3});if(total<G.n+4)total++;$('prog').innerHTML=lab()}}
function dueItem(pool,keyFn){const i=queue.findIndex(q=>q.due<=qi);if(i>-1){const q=queue.splice(i,1)[0];const it=pool.find(x=>keyFn(x)===q.k);if(it)return it}return null}
function lab(){return (qi+1)+' / '+total+'　'+(adv?'<b style="color:var(--hl)">進階 +3</b>':'<span style="color:var(--soft)">基本 +1</span>')}
function next(){qi++;if(qi>=total){finish()}else{adv=(qi%4===3);$('prog').innerHTML=lab();G.round()}}
function finish(){clearInterval(timer);$('stage').innerHTML='<div class="big">'+(sc>=total?'🏆':sc>=total*0.6?'👍':'💪')+'</div><div class="q">得到 '+sc+' ⭐</div><button class="b pri" onclick="start(G.id)">再玩一次</button><button class="b" onclick="home()">回選單</button>';say('');conf()}
function home(){clearInterval(timer);try{speechSynthesis.cancel()}catch(e){}$('play').classList.add('hide');$('home').classList.remove('hide')}
$('home2').addEventListener('click',home);

const GAMES=[
{id:0,ic:'🎧',t:'聽力拼字',d:'一步一步拼出單字',n:10,
 round(){
  const pool=ONEW.filter(j=>adv?j.e.length>=7:(qi<4?j.e.length<=6:j.e.length<=9));
  const j=dueItem(ONEW,x=>x.e)||pick(pool.length?pool:ONEW,1)[0];this.j=j;this.pos=0;this.wrong=0;this.err=false;
  $('stage').innerHTML='<div class="big">'+j.ic+'</div><div class="q">'+j.z+'</div><div class="slot" id="slot"></div>'+
   '<div id="scaf" style="font-size:19px;color:var(--soft);min-height:26px"></div><div class="tiles" id="tiles"></div>'+
   '<div><button class="b" id="again">🔊 再聽</button><button class="b" id="slow">🐢 慢慢聽</button>'+(adv?'':'<button class="b pri" id="hint">💡 給我一個字母</button>')+'</div>';
  const drawAll=()=>{$('slot').innerHTML=[...j.e].map((c,k)=>k<this.pos?'<span style="color:var(--ok)">'+c+'</span>':(c===' '?'&nbsp;':'<span style="color:var(--line)">_</span>')).join('');
   $('tiles').innerHTML=this.order.map((o,k)=>'<button class="t'+(o.done?' used':'')+'" data-i="'+k+'">'+o.c+'</button>').join('')};
  this.order=sh([...j.e].filter(c=>c!==' ')).map(c=>({c:c,done:false}));
  const mark=ch=>{const o=this.order.find(x=>!x.done&&x.c===ch);if(o)o.done=true};
  const adv2=()=>{if(j.e[this.pos]===' ')this.pos++};
  const fill=()=>{adv2();mark(j.e[this.pos]);speak(j.e[this.pos]);this.pos++;adv2();drawAll();check()};
  const check=()=>{if(this.pos>=j.e.length){if(!this.err)bump();setTimeout(()=>speak(j.e),420);say('拼好了！ '+j.e,'g');setTimeout(next,1800)}};
  drawAll();speak(j.e);
  $('again').onclick=()=>speak(j.e);
  $('slow').onclick=()=>{const r=$('rate').value;$('rate').value=0.5;speak(j.e);$('rate').value=r};
  if($('hint'))$('hint').onclick=()=>fill();
  $('tiles').onclick=ev=>{const b=ev.target.closest('.t');if(!b)return;const o=this.order[+b.dataset.i];if(o.done)return;adv2();
   if(o.c===j.e[this.pos]){o.done=true;speak(o.c);this.pos++;this.wrong=0;adv2();drawAll();say('對！','g');check()}
   else{b.classList.add('no');setTimeout(()=>b.classList.remove('no'),400);this.wrong++;
    if(!this.err){this.err=true;missed(j.e)}
    why('第 '+(this.pos+1)+' 個字母不是 <b>'+o.c+'</b>，再聽一次 🔊');speak(j.e);
    if(this.wrong>=2&&!adv){this.wrong=0;setTimeout(fill,600)}}}}},

{id:1,ic:'🧩',t:'拆字積木',d:'把零件依序組成單字',n:10,
 round(){const j=dueItem(WITHP,x=>x.e)||pick(WITHP.filter(x=>adv?x.p.length>2:x.p.length<=2).length?WITHP.filter(x=>adv?x.p.length>2:x.p.length<=2):WITHP,1)[0];
  this.j=j;this.pos=0;this.err=false;
  $('stage').innerHTML='<div class="big">'+j.ic+'</div><div class="q">'+j.z+'</div><div class="slot" id="slot"></div><div class="tiles" id="tiles"></div>';
  $('tiles').innerHTML=sh(j.p.map((p,k)=>[p,k])).map(([p,k])=>'<button class="t" data-k="'+k+'"><span>'+p[0]+'</span>'+(adv?'':'<br><span style="font-size:16px;color:var(--soft)">'+p[1]+'</span>')+'</button>').join('');
  $('tiles').onclick=ev=>{const b=ev.target.closest('.t');if(!b||b.classList.contains('used'))return;const k=+b.dataset.k;
   if(k===this.pos){b.classList.add('used');speak(j.p[this.pos][0],this.pos>0);this.pos++;
    $('slot').textContent=j.p.slice(0,this.pos).map(x=>x[0]).join('');
    if(this.pos===j.p.length){if(!this.err)bump();$('slot').textContent=j.e;setTimeout(()=>speak(j.e),450);say('組好了！','g');setTimeout(next,1700)}}
   else{b.classList.add('no');setTimeout(()=>b.classList.remove('no'),400);if(!this.err){this.err=true;missed(j.e)}
    why('順序不對。現在要放的是「'+j.p[this.pos][1]+'」的零件；「的人」永遠放最後。')}}}},

{id:2,ic:'🕵️',t:'字源偵探',d:'看古代的字，猜職業',n:10,
 round(){const j=dueItem(WITHO,x=>x.e)||pick(WITHO,1)[0];const o=pick(J.filter(x=>x.e!==j.e),adv?3:2);this.err=false;
  $('stage').innerHTML='<div class="big">📜</div><div class="q">'+j.o[0]+'<br>意思是「'+j.o[1]+'」<br><span style="font-size:20px;color:var(--soft)">變成哪個職業？</span></div><div id="ops"></div>';
  $('ops').innerHTML=sh([j,...o]).map(x=>'<button class="ch" data-e="'+x.e+'">'+x.ic+' '+x.e+'</button>').join('');
  $('ops').onclick=ev=>{const b=ev.target.closest('.ch');if(!b)return;const x=J.find(y=>y.e===b.dataset.e);
   if(x.e===j.e){b.classList.add('ok');if(!this.err)bump();speak(j.e);say('偵探成功！','g');setTimeout(next,1400)}
   else{b.classList.add('no');if(!this.err){this.err=true;missed(j.e)}
    why('<b>'+x.e+'</b> 是「'+x.z+'」'+(x.o?'，它來自 '+x.o[0]:'')+'，不是這一題的答案。')}}}},

{id:3,ic:'👤',t:'找「人」字尾',d:'點出會動的「人」字尾',n:10,
 round(){const good=pick(['er','or','ist','an','eer','yer'],adv?4:3),bad=pick(['ing','ed','ly','est','ful','ness'],adv?4:3);
  const all=sh(good.map(x=>[x,1]).concat(bad.map(x=>[x,0])));this.err=false;
  $('stage').innerHTML='<div class="q">點出「人」的字尾<br><span style="font-size:19px;color:var(--soft)">-er -or -ist -an -eer -yer</span></div><div class="float" id="fl"></div><div class="timer"><i id="tb"></i></div>';
  const fl=$('fl');let left=good.length,t=100;
  all.forEach(([w,g],k)=>{const el=document.createElement('button');el.className='fw';el.textContent=w;
   el.style.left=(6+Math.random()*60)+'%';el.style.top=(4+k*11.5)+'%';fl.appendChild(el);
   let d=(Math.random()>.5?1:-1)*(adv?0.45:0.28),x=parseFloat(el.style.left);
   el._iv=setInterval(()=>{x+=d;if(x<3||x>70)d=-d;el.style.left=x+'%'},40);
   el.onclick=()=>{if(el.classList.contains('hit'))return;
    if(g){el.classList.add('hit');speak(w,1);left--;say('找到了！','g');
     if(!left){if(!this.err)bump();clearInterval(timer);fl.querySelectorAll('.fw').forEach(e=>clearInterval(e._iv));say('全找到了！','g');setTimeout(next,1200)}}
    else{el.classList.add('miss');if(!this.err){this.err=true;missed('suffix')}
     why('<b>-'+w+'</b> 不是「人」。-ed、-ing、-ly、-ful 是動作或樣子；只有 -er、-or、-ist、-an、-eer、-yer 才是人。');
     setTimeout(()=>el.classList.remove('miss'),600)}}});
  clearInterval(timer);timer=setInterval(()=>{t-=adv?1.8:1.2;$('tb').style.width=Math.max(0,t)+'%';
   if(t<=0){clearInterval(timer);fl.querySelectorAll('.fw').forEach(e=>clearInterval(e._iv));why('時間到，還有沒找到的「人」字尾。');setTimeout(next,1400)}},100)}},

{id:4,ic:'⏳',t:'時光機',d:'把以前、後來排順序',n:10,
 round(){const j=dueItem(WITHO,x=>x.e)||pick(WITHO,1)[0];this.j=j;this.err=false;
  const steps=[['📜',(adv?'':'以前：')+j.o[0]+' ＝ '+j.o[1]],['🔤',(adv?'':'後來：')+'變成英文 '+j.e],[j.ic,(adv?'':'現在：')+j.z]];
  this.need=0;
  $('stage').innerHTML='<div class="q">從最早點到最晚</div><div class="ord" id="ord"></div>';
  $('ord').innerHTML=sh([0,1,2]).map(k=>'<button class="oc" data-k="'+k+'"><span class="n">?</span><span style="font-size:30px">'+steps[k][0]+'</span><span>'+steps[k][1]+'</span></button>').join('');
  $('ord').onclick=ev=>{const b=ev.target.closest('.oc');if(!b||b.disabled)return;
   if(+b.dataset.k===this.need){b.querySelector('.n').textContent=(this.need+1);b.style.borderColor='var(--ok)';b.style.background='#DFF5E6';b.disabled=true;this.need++;
    if(this.need===3){if(!this.err)bump();speak(j.e);say('順序正確！','g');setTimeout(next,1400)}}
   else{b.classList.add('no');setTimeout(()=>b.classList.remove('no'),400);if(!this.err){this.err=true;missed(j.e)}
    why('順序是：先有古代的字（'+j.o[0]+'），再變成英文（'+j.e+'），最後才是現在的職業（'+j.z+'）。')}}}},

{id:5,ic:'🏆',t:'排行榜挑戰',d:'依台灣名次排順序',n:10,
 round(){const n=adv?4:3;const three=pick(J.filter(x=>x.tw),n).sort((a,b)=>a.tw-b.tw);this.three=three;this.need=0;this.err=false;
  $('stage').innerHTML='<div class="q"><i class="tw"></i> 台灣小學生最喜歡<br><span style="font-size:19px;color:var(--soft)">從第 1 名開始點</span></div><div class="ord" id="ord"></div>';
  $('ord').innerHTML=sh(three).map(x=>'<button class="oc" data-e="'+x.e+'"><span class="n">?</span><span style="font-size:30px">'+x.ic+'</span><span>'+x.z+'<br><span style="font-size:17px;color:var(--soft)">'+x.e+'</span></span></button>').join('');
  $('ord').onclick=ev=>{const b=ev.target.closest('.oc');if(!b||b.disabled)return;const x=J.find(y=>y.e===b.dataset.e);
   if(x.e===this.three[this.need].e){b.querySelector('.n').textContent='第'+x.tw;b.style.borderColor='var(--ok)';b.style.background='#DFF5E6';b.disabled=true;speak(x.e);this.need++;
    if(this.need===n){if(!this.err)bump();say('排對了！','g');setTimeout(next,1400)}}
   else{b.classList.add('no');setTimeout(()=>b.classList.remove('no'),400);if(!this.err){this.err=true;missed(this.three[0].e)}
    why(x.z+' 是第 '+x.tw+' 名，'+this.three[this.need].z+'（第 '+this.three[this.need].tw+' 名）比較前面。')}}}},

{id:6,ic:'⭕',t:'真假字源',d:'判斷說法對不對',n:10,
 round(){const pool=TF.filter(q=>adv?q[3]===1:q[3]===0);
  const q=dueItem(TF,x=>x[0])||pick(pool.length?pool:TF,1)[0];this.err=false;
  $('stage').innerHTML='<div class="big">🤔</div><div class="q">'+q[0]+'</div><div id="ops"><button class="ch" data-v="1">⭕ 對</button><button class="ch" data-v="0">❌ 錯</button></div>';
  $('ops').onclick=ev=>{const b=ev.target.closest('.ch');if(!b)return;
   if(+b.dataset.v===q[1]){b.classList.add('ok');if(!this.err)bump();say('答對了！<br><span style="font-size:20px;font-weight:400;color:var(--ink)">'+q[2]+'</span>','g');setTimeout(next,2200)}
   else{b.classList.add('no');if(!this.err){this.err=true;missed(q[0])}
    why('正確答案是「'+(q[1]?'對':'錯')+'」。'+q[2])}}}},

{id:7,ic:'⚡',t:'快問快答',d:'限時看圖選英文',n:20,
 round(){const j=dueItem(J,x=>x.e)||pick(J,1)[0],o=pick(J.filter(x=>x.e!==j.e),adv?3:2);let t=100;this.err=false;
  $('stage').innerHTML='<div class="big">'+j.ic+'</div><div class="q">'+j.z+'</div><div id="ops"></div><div class="timer"><i id="tb"></i></div>';
  $('ops').innerHTML=sh([j,...o]).map(x=>'<button class="ch" data-e="'+x.e+'">'+x.e+'</button>').join('');
  clearInterval(timer);timer=setInterval(()=>{t-=adv?3.2:1.8;$('tb').style.width=Math.max(0,t)+'%';
   if(t<=0){clearInterval(timer);missed(j.e);why('時間到，'+j.z+' 是 <b>'+j.e+'</b>。');setTimeout(next,1600)}},100);
  $('ops').onclick=ev=>{const b=ev.target.closest('.ch');if(!b)return;clearInterval(timer);const x=J.find(y=>y.e===b.dataset.e);
   if(x.e===j.e){b.classList.add('ok');bump();speak(j.e);say('快又準！','g');setTimeout(next,1100)}
   else{b.classList.add('no');missed(j.e);why('<b>'+x.e+'</b> 是「'+x.z+'」；'+j.z+' 要選 <b>'+j.e+'</b>。');setTimeout(next,2300)}}}},

{id:8,ic:'⌨️',t:'中翻英打字',d:'看中文打出英文',n:10,
 round(){const pool=ONEW.filter(j=>adv?j.e.length>=8:j.e.length<=7);
  const j=dueItem(ONEW,x=>x.e)||pick(pool.length?pool:ONEW,1)[0];
  $('stage').innerHTML='<div class="big">'+j.ic+'</div><div class="q">'+j.z+'</div><input type="text" id="tin" autocomplete="off" autocapitalize="off" spellcheck="false"><div><button class="b pri" id="go">送出</button>'+(adv?'':'<button class="b" id="hint">💡 提示</button><button class="b" id="lis">🔊 聽</button>')+'</div>';
  const go=()=>{const v=$('tin').value.trim().toLowerCase();
   if(v===j.e){bump();speak(j.e);say('拼對了！','g');setTimeout(next,1300)}
   else{missed(j.e);let i=0;while(i<v.length&&v[i]===j.e[i])i++;
    why('正確是 <b>'+j.e+'</b>。你從第 '+(i+1)+' 個字母開始不一樣。');setTimeout(next,2600)}};
  $('go').onclick=go;$('tin').onkeydown=e=>{if(e.key==='Enter')go()};
  if($('hint'))$('hint').onclick=()=>{say('開頭是 '+j.e.slice(0,Math.ceil(j.e.length/2))+'…');speak(j.e)};
  if($('lis'))$('lis').onclick=()=>speak(j.e);
  $('tin').focus()}},

{id:9,ic:'🃏',t:'翻牌配對',d:'圖和英文配成一對',n:1,
 round(){const num=6;const six=pick(J,num);let cards=sh(six.map(j=>({k:j.e,f:j.ic,t:'ic'})).concat(six.map(j=>({k:j.e,f:j.e,t:'en'}))));
  this.open=[];this.done=0;
  $('stage').innerHTML='<div class="q">找出 '+num+' 對</div><div class="mem" id="mem"></div>';
  $('mem').innerHTML=cards.map((c,k)=>'<button class="mc" data-k="'+k+'">?</button>').join('');
  $('mem').onclick=ev=>{const b=ev.target.closest('.mc');if(!b||b.classList.contains('done')||b.classList.contains('up')||this.open.length>1)return;
   const c=cards[+b.dataset.k];b.classList.add('up');b.innerHTML='<span style="font-size:'+(c.t==='ic'?'30px':'15px')+'">'+c.f+'</span>';
   if(c.t==='en')speak(c.f);this.open.push([b,c]);
   if(this.open.length===2){const[[b1,c1],[b2,c2]]=this.open;
    if(c1.k===c2.k&&c1.t!==c2.t){b1.classList.add('done');b2.classList.add('done');this.open=[];this.done++;sc++;$('sc').textContent=sc;say('配對成功！','g');
     if(this.done===num){conf();say('全部配對完成！','g');setTimeout(()=>{total=sc;finish()},1300)}}
    else{const j1=J.find(x=>x.e===c1.k),j2=J.find(x=>x.e===c2.k);
     why('這兩張不是一對：'+j1.ic+' 是 <b>'+j1.e+'</b>（'+j1.z+'），'+j2.ic+' 是 <b>'+j2.e+'</b>（'+j2.z+'）。');
     setTimeout(()=>{[b1,b2].forEach(x=>{x.classList.remove('up');x.textContent='?'});this.open=[]},1600)}}}}}
];

$('menu').innerHTML=GAMES.map((g,k)=>'<button class="gi" data-k="'+k+'"><span class="gn">'+(k+1)+'</span><span class="ge">'+g.ic+'</span><span class="gt">'+g.t+'</span><span class="gd">'+g.d+'</span></button>').join('');
$('menu').onclick=ev=>{const b=ev.target.closest('.gi');if(b)start(+b.dataset.k)};
function start(k){G=GAMES[k];sc=0;qi=0;total=G.n;queue=[];adv=false;
 $('home').classList.add('hide');$('play').classList.remove('hide');
 $('sc').textContent=0;$('prog').innerHTML=(G.n>1?lab():'配對');say('');G.round()}
/* 從首頁直接進入：#g1～#g10 */
function route(){const m=location.hash.match(/^#g(\d+)$/);if(m&&GAMES[+m[1]-1]){home();start(+m[1]-1)}}
route();addEventListener('hashchange',route);
</script>
